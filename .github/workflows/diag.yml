name: diag
on: pull_request
permissions:
  contents: read
  id-token: write
jobs:
  diag:
    if: startsWith(github.head_ref, 'diag/')
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::306024784101:role/github-sourceplane-nimbus-runners
          aws-region: us-east-1
      - run: |
          set -u
          since=$(( ($(date +%s) - 3600) * 1000 ))
          for fn in scale-up; do
            echo "===== /aws/lambda/nimbus-runners-$fn"
            aws logs filter-log-events --log-group-name "/aws/lambda/nimbus-runners-$fn" --start-time $since \
              --query 'events[].message' --output text 2>&1 | tr '\t' '\n' | grep -vE '^\s*$' | cut -c1-300 | grep -iE 'error|warn|fail' | tail -15
          done
          echo "===== queues"
          for q in $(aws sqs list-queues --queue-name-prefix nimbus-runners --query 'QueueUrls[]' --output text); do
            echo "$q $(aws sqs get-queue-attributes --queue-url $q --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible --query Attributes --output text)"
          done
          echo "===== instances"
          aws ec2 describe-instances --filters Name=tag:ghr:environment,Values=nimbus-runners --query 'Reservations[].Instances[].[InstanceId,State.Name,InstanceType,LaunchTime,InstanceLifecycle]' --output text
          echo "===== ami param"
          aws ssm get-parameter --name /nimbus-runners/ami-id --query 'Parameter.[Value,DataType]' --output text
          echo "===== start-runner output per instance"
          for iid in $(aws ec2 describe-instances --filters Name=tag:ghr:environment,Values=nimbus-runners --query 'sort_by(Reservations[].Instances[],&LaunchTime)[-2:].InstanceId' --output text); do
            echo "--- $iid"
            aws ec2 get-console-output --instance-id "$iid" --output text --query Output 2>&1 | grep -a 'user-data' | cut -c1-240 | tail -45
          done
