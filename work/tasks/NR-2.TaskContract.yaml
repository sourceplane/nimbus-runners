    - "the github-sourceplane-nimbus-runners role and nimbus-runners-boundary exist (sourceplane/aws-admin#35)"
    - "orun plan --env prod resolves the OCI stack and binds terraform-aws"
    - "CI carries plan and run jobs with remote state and GitHub-hosted runners only"
  gates: []
